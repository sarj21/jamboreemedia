<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jamboree Media</title>

    <style>
      @font-face {
        font-family: "GR Read One";
        src: url("fonts/GRReadOne.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @import url("https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap");

      :root {
        --yellow: #fcbc36;
        --red: #ed230d;
        --white: #ffffff;
        --black: #000000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        padding: 35px;

        background-image: url("img/background.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        color: var(--white);
        font-family: "Open Sans", Arial, Helvetica, sans-serif;

        overflow-x: hidden;
      }

      .page {
        width: 100%;
        min-height: calc(100vh - 70px);

        display: flex;
        flex-direction: column;
      }

      /* ========================================
         BRAND
      ======================================== */

      .brand {
        position: relative;
        z-index: 2;
        width: 100%;
      }

      .brand h1 {
        width: 100%;
        max-width: 100%;

        margin: 0;

        font-family: "GR Read One", sans-serif;
        font-size: clamp(80px, 14vw, 210px);
        font-weight: normal;
        line-height: 0.72;
        letter-spacing: -9px;

        text-transform: uppercase;
        white-space: nowrap;

        text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
      }

      .brand-subtitle {
        width: 100%;
        max-width: 100%;

        margin: 18px 0 0 5px;

        font-family: "GR Read One", sans-serif;
        font-size: clamp(68px, 12.5vw, 185px);
        font-weight: normal;
        line-height: 0.72;
        letter-spacing: -7px;

        text-transform: uppercase;
        white-space: nowrap;

        text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
      }

      /* ========================================
         NEXT SHOW
      ======================================== */

      .show {
        width: min(850px, 100%);

        /*
         * Keeps the show information high on the page,
         * away from the busier lower part of the image.
         */
        margin-top: clamp(45px, 6vh, 75px);
        margin-left: auto;

        position: relative;
        z-index: 3;
      }

      .show-label {
        display: inline-block;

        margin: 0 0 12px;
        padding: 6px 10px;

        background: var(--red);
        color: var(--white);

        font-size: 12px;
        font-weight: 800;
        letter-spacing: 2px;

        text-transform: uppercase;
      }

      .show-date {
        width: 100%;

        margin: 0;

        font-size: clamp(45px, 6.5vw, 95px);
        font-weight: 800;
        line-height: 0.85;
        letter-spacing: -5px;

        text-transform: uppercase;
        white-space: nowrap;
      }

      /* ========================================
         TICKETS
      ======================================== */

      .tickets {
        position: relative;

        display: flex;
        align-items: center;
        justify-content: space-between;

        width: 100%;

        margin-top: 25px;
        padding: 17px 24px;

        background: var(--yellow);
        color: var(--black);

        text-decoration: none;

        overflow: hidden;

        transition:
          transform 0.2s ease,
          color 0.2s ease;
      }

      .tickets::before {
        content: "";

        position: absolute;
        inset: 0;

        background: var(--red);

        transform: translateY(100%);

        transition: transform 0.25s ease;
      }

      .tickets:hover::before {
        transform: translateY(0);
      }

      .tickets:hover {
        color: var(--white);
        transform: translateX(-8px);
      }

      .ticket-text {
        position: relative;
        z-index: 1;

        font-size: clamp(40px, 5.8vw, 76px);
        font-weight: 800;
        line-height: 0.8;
        letter-spacing: -4px;

        text-transform: uppercase;
      }

      .ticket-arrow {
        position: relative;
        z-index: 1;

        font-size: clamp(40px, 5.5vw, 70px);
        font-weight: 800;
        line-height: 0;

        transition: transform 0.25s ease;
      }

      .tickets:hover .ticket-arrow {
        transform: translateX(15px);
      }

      /* ========================================
         BOTTOM
      ======================================== */

      .bottom {
        margin-top: auto;
        padding-top: 50px;

        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }

      .socials {
        display: flex;
        gap: 18px;
      }

      .socials a {
        display: flex;

        transition:
          transform 0.2s ease,
          opacity 0.2s ease;
      }

      .socials a:hover {
        transform: scale(1.15);
        opacity: 0.65;
      }

      .socials img {
        width: 27px;
        height: 27px;

        object-fit: contain;
      }

      /* ========================================
         CONTACT
      ======================================== */

      .contact {
        text-align: right;
        font-size: 13px;
      }

      .contact-label {
        display: block;

        margin-bottom: 4px;

        color: rgba(255, 255, 255, 0.5);

        font-size: 9px;
        font-weight: 800;
        letter-spacing: 2px;

        text-transform: uppercase;
      }

      .contact a {
        color: var(--white);
        text-decoration: none;
        font-weight: 600;
      }

      .contact a:hover {
        color: var(--yellow);
      }

      /* ========================================
         MOBILE
      ======================================== */

      @media (max-width: 700px) {
        body {
          padding: 20px;
          background-attachment: scroll;
        }

        .page {
          min-height: calc(100vh - 40px);
          width: 100%;
        }

        /* ========================================
           BRAND
        ======================================== */

        .brand {
          width: 100%;
        }

        .brand h1 {
          width: 100%;
          max-width: 100%;

          margin: 0;

          font-size: clamp(48px, 15vw, 90px);

          line-height: 0.8;
          letter-spacing: -4px;

          white-space: nowrap;
          word-break: keep-all;
          overflow: visible;
        }

        .brand-subtitle {
          width: 100%;
          max-width: 100%;

          margin-top: 10px;
          margin-left: 2px;

          font-size: clamp(45px, 14vw, 82px);

          line-height: 0.8;
          letter-spacing: -3px;

          white-space: nowrap;
          word-break: keep-all;
          overflow: visible;
        }

        /* ========================================
           NEXT SHOW
        ======================================== */

        .show {
          width: 100%;

          margin-top: 45px;
          margin-left: 0;
        }

        .show-label {
          margin-bottom: 12px;

          padding: 5px 8px;

          font-size: 10px;
          letter-spacing: 1.5px;
        }

        .show-date {
          width: 100%;

          font-size: clamp(38px, 11vw, 65px);
          line-height: 0.9;
          letter-spacing: -2px;

          white-space: normal;
          overflow-wrap: break-word;
        }

        /* ========================================
           TICKETS
        ======================================== */

        .tickets {
          width: 100%;

          margin-top: 20px;
          padding: 14px 16px;

          transform: none;
        }

        .ticket-text {
          font-size: clamp(32px, 10vw, 55px);
          line-height: 0.85;
          letter-spacing: -2px;

          white-space: nowrap;
        }

        .ticket-arrow {
          flex-shrink: 0;

          margin-left: 15px;

          font-size: clamp(32px, 10vw, 55px);
        }

        .tickets:hover {
          transform: none;
        }

        /* ========================================
           BOTTOM
        ======================================== */

        .bottom {
          width: 100%;

          margin-top: auto;
          padding-top: 35px;

          display: flex;
          flex-direction: row;
          align-items: flex-end;
          justify-content: space-between;

          gap: 10px;
        }

        .socials {
          display: flex;
          align-items: center;
          gap: clamp(10px, 3vw, 15px);

          flex-shrink: 0;
        }

        .socials img {
          width: clamp(20px, 6vw, 25px);
          height: clamp(20px, 6vw, 25px);
        }

        .contact {
          min-width: 0;

          text-align: right;

          font-size: clamp(9px, 2.5vw, 11px);

          overflow: hidden;
        }

        .contact-label {
          margin-bottom: 3px;

          font-size: clamp(7px, 2vw, 9px);
          letter-spacing: 1.5px;
        }

        .contact a {
          display: block;

          max-width: 100%;

          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }

      /* ========================================
   SMALL PHONES
======================================== */

      @media (max-width: 450px) {
        body {
          padding: 14px;
        }

        .page {
          min-height: calc(100vh - 28px);
        }

        .brand h1 {
          font-size: clamp(42px, 14vw, 75px);
          letter-spacing: -4px;
        }

        .brand-subtitle {
          margin-top: 10px;

          font-size: clamp(40px, 13vw, 70px);
          letter-spacing: -3px;
        }

        .show {
          margin-top: 38px;
        }

        .show-date {
          font-size: 10.5vw;
          letter-spacing: -1.5px;
        }

        .tickets {
          padding: 13px 14px;
        }

        .ticket-text {
          font-size: 9vw;
          letter-spacing: -1.5px;
        }

        .ticket-arrow {
          font-size: 9vw;
          margin-left: 10px;
        }

        .bottom {
          padding-top: 30px;
          gap: 8px;
        }

        .socials {
          gap: 9px;
        }

        .socials img {
          width: 21px;
          height: 21px;
        }

        .contact {
          font-size: 9px;
        }

        .contact-label {
          font-size: 7px;
          letter-spacing: 1px;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <!-- BRAND -->

      <header class="brand">
        <h1>Jamboree</h1>

        <div class="brand-subtitle">Media</div>
      </header>

      <!-- NEXT SHOW -->

      <section class="show">
        <p class="show-label">Next Show</p>

        <h2 class="show-date">August 29, 2026</h2>

        <a
          class="tickets"
          href="https://tiny.cc/jamboree"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="ticket-text"> Get Tickets </span>

          <span class="ticket-arrow"> → </span>
        </a>
      </section>

      <!-- SOCIALS + CONTACT -->

      <div class="bottom">
        <nav class="socials" aria-label="Social media">
          <a
            href="https://instagram.com/jamboree.media"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <img src="img/instagram.png" alt="" />
          </a>

          <a
            href="https://youtube.com/@jamboreemedia"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube"
          >
            <img src="img/youtube.png" alt="" />
          </a>

          <a
            href="https://tiktok.com/@jamboree.media"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="TikTok"
          >
            <img src="img/tiktok.png" alt="" />
          </a>
        </nav>

        <footer class="contact">
          <span class="contact-label"> Contact </span>

          <a href="mailto:steven@jamboree.media"> steven@jamboree.media </a>
        </footer>
      </div>
    </main>
  </body>
</html>
